# Atualização automática de dependências.
#
# Zero-day não se previne — o que dá para encurtar é a janela entre a correção
# sair e ela estar no ar. O Dependabot abre o PR sozinho; sem isso, a gente só
# descobre que havia correção quando roda `npm audit` por acaso.
version: 2
updates:
  - package-ecosystem: npm
    directory: /backend
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      # Patch e minor entram juntos num PR só: são a maioria e quase nunca
      # quebram nada. Major fica separado, um a um, para ler com calma.
      rotina:
        update-types: [minor, patch]
    labels: [dependencias, backend]

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      rotina:
        update-types: [minor, patch]
    labels: [dependencias, frontend]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
