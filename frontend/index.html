<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <!-- Aba do navegador. O de 32 serve o dia a dia; o de 192 é o que o
         Android usa ao fixar na tela inicial. -->
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/favicon-192.png" />

    <!-- O iOS ignora transparência e pinta o fundo de preto; este arquivo já
         vem com fundo branco por isso. -->
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <link rel="manifest" href="/site.webmanifest" />

    <!-- Pinta a barra do navegador no Android. Era o roxo do desenho antigo. -->
    <meta name="theme-color" content="#1d2340" />

    <title>CliniStudio — Gestão para beleza, estética e clínicas</title>
    <meta
      name="description"
      content="Agenda, clientes, caixa e aluguel de espaços num lugar só. Para salões, clínicas de estética e espaços compartilhados de beleza."
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
