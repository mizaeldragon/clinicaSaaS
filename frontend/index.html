<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <!-- Aba do navegador. O de 32 serve o dia a dia; o de 192 é o que o
         Android usa ao fixar na tela inicial. -->
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/favicon-192.png" />

    <!-- O iOS ignora transparência e pinta o fundo de preto; este arquivo já
         vem com fundo branco por isso. -->
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <link rel="manifest" href="/site.webmanifest" />

    <!-- Pinta a barra do navegador no Android. Era o roxo do desenho antigo. -->
    <meta name="theme-color" content="#1d2340" />

    <title>CliniStudio — Sistema de gestão para salões e clínicas de estética</title>
    <meta
      name="description"
      content="Agenda online, ficha das clientes, caixa e comissões num sistema só. A cliente marca sozinha pelo seu link. Para salões, clínicas de estética, studios e barbearias."
    />
    <!-- A prévia do link no WhatsApp e no Instagram lê estas, não a description. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="CliniStudio" />
    <meta property="og:title" content="CliniStudio — Sistema de gestão para salões e clínicas de estética" />
    <meta
      property="og:description"
      content="Agenda online, ficha das clientes, caixa e comissões num sistema só. A cliente marca sozinha pelo seu link."
    />
    <!-- O logo num quadro de 1200×630, o tamanho que WhatsApp, Facebook e
         LinkedIn esperam para a prévia grande. Largura e altura declaradas
         deixam a prévia aparecer já no primeiro envio, sem esperar o
         aplicativo baixar a imagem para medir. -->
    <meta property="og:url" content="https://www.clinistudio.com.br/" />
    <meta property="og:image" content="https://www.clinistudio.com.br/og-clinistudio.jpg" />
    <meta property="og:image:secure_url" content="https://www.clinistudio.com.br/og-clinistudio.jpg" />
    <meta property="og:image:type" content="image/jpeg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="CliniStudio — Você cuida da beleza. Nós simplificamos a gestão."
    />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="https://www.clinistudio.com.br/og-clinistudio.jpg" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
